name: Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/tests.yml"
      - "tests/**"
      - "sht31/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  run-unit-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Run all tests
        run: uv run --locked pytest tests -vv
